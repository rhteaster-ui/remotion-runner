name: Render Remotion Video

on:
  push:
    branches:
      - 'render-*'
      - 'main'
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Pull assets if script exists
        run: |
          if [ -f scripts/pull-assets.sh ]; then
            bash scripts/pull-assets.sh || true
          fi

      - name: Render Remotion Video
        run: |
          mkdir -p out
          COMP="${{ github.event.inputs.composition }}"
          if [ -z "$COMP" ]; then
            COMP=$(node -e "
              try {
                const pkg = require('./package.json');
                const m = pkg.scripts?.render?.match(/render\s+([A-Za-z0-9_-]+)/);
                if (m) { console.log(m[1]); process.exit(0); }
              } catch(e) {}
              try {
                const fs = require('fs');
                const root = fs.readFileSync('src/Root.tsx', 'utf8');
                const m = root.match(/<Composition\s+id=[\"']([^\"']+)[\"']/);
                if (m) { console.log(m[1]); process.exit(0); }
              } catch(e) {}
              console.log('RhmtReview');
            ")
          fi
          echo "Rendering composition: $COMP"
          npx remotion render "$COMP" out/video.mp4 --gl=angle --overwrite

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
          retention-days: 1
